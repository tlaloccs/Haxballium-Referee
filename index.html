<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1210">
<title>Silbato — Control de partido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">●</span>
      <span class="brand-name">Silbato</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="partido">Partido</button>
      <button class="tab" data-tab="historial">Historial</button>
      <button class="tab" data-tab="ligas">Ligas</button>
      <button class="tab" data-tab="ajustes">Ajustes</button>
    </nav>
  </header>

  <main class="screens">

    <!-- ============ PANTALLA: PARTIDO ============ -->
    <section id="screen-partido" class="screen active">

      <div id="setupMatch" class="panel setup-panel">
        <h2>Nuevo partido</h2>
        <div class="setup-grid">
          <div class="team-setup">
            <label>Equipo local</label>
            <input type="text" id="teamAName" placeholder="Rojo" maxlength="18">
            <input type="color" id="teamAColor" value="#E14B4B">
          </div>
          <div class="vs-mark">VS</div>
          <div class="team-setup">
            <label>Equipo visitante</label>
            <input type="text" id="teamBName" placeholder="Azul" maxlength="18">
            <input type="color" id="teamBColor" value="#3B82C4">
          </div>
        </div>
        <button class="btn btn-primary" id="btnCrearPartido">Crear partido</button>
        <p class="hint">También podés iniciar partidos directamente desde una liga en la pestaña <b>Ligas</b>.</p>
      </div>

      <div id="liveMatch" class="live-layout hidden">

        <div class="panel preview-panel">
          <canvas id="scoreboardCanvas" width="1000" height="560"></canvas>
          <div class="discord-status" id="discordStatus">
            <span class="dot" id="discordDot"></span>
            <span id="discordStatusText">Sin enviar todavía</span>
          </div>
        </div>

        <div class="panel control-panel">

          <div class="control-block">
            <h3>Tiempo</h3>
            <div class="clock-row">
              <span class="clock" id="clockDisplay">00:00</span>
              <span class="half-badge" id="halfBadge">1T</span>
            </div>
            <div class="btn-row">
              <button class="btn" id="btnIniciar">▶ Iniciar</button>
              <button class="btn" id="btnPausar">⏸ Pausar</button>
              <button class="btn" id="btnMedioTiempo">½ Entretiempo</button>
              <button class="btn btn-danger" id="btnTerminar">🏁 Finalizar</button>
            </div>
          </div>

          <div class="control-block">
            <h3>Goles</h3>
            <div class="btn-row">
              <button class="btn btn-team" id="btnGolA">⚽ Gol local</button>
              <button class="btn btn-team" id="btnGolB">⚽ Gol visitante</button>
            </div>
          </div>

          <div class="control-block">
            <h3>Tarjetas y offside</h3>
            <div class="btn-row">
              <button class="btn btn-yellow" id="btnAmarillaA">🟨 Local</button>
              <button class="btn btn-red" id="btnRojaA">🟥 Local</button>
              <button class="btn btn-offside" id="btnOffsideA">🚩 Offside local</button>
            </div>
            <div class="btn-row">
              <button class="btn btn-yellow" id="btnAmarillaB">🟨 Visitante</button>
              <button class="btn btn-red" id="btnRojaB">🟥 Visitante</button>
              <button class="btn btn-offside" id="btnOffsideB">🚩 Offside visitante</button>
            </div>
          </div>

          <div class="control-block">
            <h3>Eventos</h3>
            <ul class="event-list" id="eventList"></ul>
            <button class="btn btn-ghost" id="btnDeshacer">Deshacer último evento</button>
          </div>

        </div>
      </div>

    </section>

    <!-- ============ PANTALLA: HISTORIAL ============ -->
    <section id="screen-historial" class="screen">
      <div class="panel">
        <h2>Historial de partidos</h2>
        <div id="historialList" class="history-list"></div>
      </div>
    </section>

    <!-- ============ PANTALLA: LIGAS ============ -->
    <section id="screen-ligas" class="screen">

      <div class="panel" id="ligasListPanel">
        <div class="panel-head">
          <h2>Ligas y torneos</h2>
          <button class="btn btn-primary" id="btnNuevaLiga">+ Nueva liga</button>
        </div>
        <div id="ligasList" class="ligas-list"></div>
      </div>

      <div class="panel hidden" id="nuevaLigaPanel">
        <h2>Crear liga o torneo</h2>
        <label>Nombre de la liga</label>
        <input type="text" id="ligaNombre" placeholder="Liga Apertura 2026">

        <label>Formato</label>
        <div class="format-choice">
          <label class="radio-card">
            <input type="radio" name="ligaFormato" value="liga" checked>
            <span>Liga (todos contra todos)</span>
          </label>
          <label class="radio-card">
            <input type="radio" name="ligaFormato" value="elim">
            <span>Eliminatoria directa</span>
          </label>
        </div>

        <label>Equipos</label>
        <div id="ligaEquiposList" class="liga-equipos-list"></div>
        <div class="add-team-row">
          <input type="text" id="ligaEquipoNombre" placeholder="Nombre del equipo">
          <input type="color" id="ligaEquipoColor" value="#4CC38A">
          <button class="btn" id="btnAgregarEquipoLiga">Agregar</button>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="btnGenerarLiga">Generar fixture</button>
          <button class="btn btn-ghost" id="btnCancelarLiga">Cancelar</button>
        </div>
      </div>

      <div class="panel hidden" id="ligaDetallePanel"></div>

    </section>

    <!-- ============ PANTALLA: AJUSTES ============ -->
    <section id="screen-ajustes" class="screen">
      <div class="panel">
        <h2>Webhook de Discord</h2>
        <label>URL del webhook</label>
        <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/....">
        <div class="btn-row">
          <button class="btn btn-primary" id="btnGuardarWebhook">Guardar</button>
          <button class="btn" id="btnProbarWebhook">Probar conexión</button>
        </div>
        <p class="hint" id="webhookHint"></p>
      </div>

      <div class="panel">
        <h2>Preferencias</h2>
        <label>Duración de cada tiempo (minutos, referencia visual)</label>
        <input type="number" id="halfMinutes" min="1" max="60" value="5">
        <label>Actualizar imagen en Discord cada (segundos)</label>
        <input type="number" id="updateIntervalSec" min="3" max="60" value="5">
        <button class="btn btn-primary" id="btnGuardarAjustes">Guardar preferencias</button>
      </div>
    </section>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
